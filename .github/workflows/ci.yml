name: Doctori CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: doctori-server

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/doctori

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: doctori-server/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build backend
        run: npm run build


  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: doctori-client

    env:
      JWT_SECRET: doctori-ci-build-secret
      NEXT_PUBLIC_BASE_API_URL: https://doctori-server.onrender.com/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: doctori-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build